# 输出模板 · 视频素材包
# 05 Product Video Agent 的标准输出结构

meta:
  product_name: ""
  platform: ""                 # shopee | mercadolivre | amazon | tiktokshop | shopify
  target_market: ""
  mode: ""                     # standard | variant
  production_mode: ""          # ai_generated | real_shoot | mixed
  prompt_version: "05-Product-Video v0.1"
  upstream: ["03-Listing-Creative", "04-Product-Image"]

# ─────────────────────────────────────────────
# 1. 钩子
# ─────────────────────────────────────────────
hook:
  candidates:
    - type: ""                 # 痛点直击 | 结果前置 | 反常识 | 对比冲击 | 场景代入
      copy: ""
      visual: ""
  selected: ""
  selected_type: ""
  reason: ""
  source: ""                   # 来自哪条评论洞察

# ─────────────────────────────────────────────
# 2. 脚本
# ─────────────────────────────────────────────
scripts:
  - duration: 15
    segments:
      - {stage: "钩子", time: "0-3s", goal: "", content: ""}
      - {stage: "核心卖点", time: "3-9s", goal: "", content: ""}
      - {stage: "场景", time: "9-13s", goal: "", content: ""}
      - {stage: "CTA", time: "13-15s", goal: "", content: ""}
  - duration: 30
    segments:
      - {stage: "钩子", time: "0-3s", goal: "", content: ""}
      - {stage: "卖点 1", time: "3-9s", goal: "", content: ""}
      - {stage: "卖点 2", time: "9-16s", goal: "", content: ""}
      - {stage: "场景", time: "16-23s", goal: "", content: ""}
      - {stage: "参数/信任", time: "23-28s", goal: "", content: ""}
      - {stage: "CTA", time: "28-30s", goal: "", content: ""}

# ─────────────────────────────────────────────
# 3. 分镜表
# ─────────────────────────────────────────────
storyboard:
  - shot: 1
    time: "0-3s"
    duration_s: 3
    visual: ""                 # 具体到能拍
    camera: ""                 # 固定 / 推近 / 跟随 / 环绕 …
    subtitle: ""               # 静音字幕，≤20 字符
    audio: ""                  # 人声 / 环境音 / 音效
    type: "ai"                 # ai | real_shoot
  # ... 继续

# ─────────────────────────────────────────────
# 4. AI 视频 Prompt（type = ai 的镜头）
# ─────────────────────────────────────────────
video_prompts:
  - shot: 1
    prompt: ""                 # 六槽位：SUBJECT / ACTION / CAMERA / LIGHTING / ENVIRONMENT / STYLE
    negative_prompt: ""
    aspect_ratio: "1:1"
    duration_s: 3
    motion_intensity: "low"    # low | medium
    generation_mode: "text2video"   # text2video | image2video
    first_frame_prompt: ""     # image2video 时的首帧
    checks:
      param_consistency: true
      scene_in_scope: true
      no_real_person: true

# ─────────────────────────────────────────────
# 5. 真人镜头拍摄指令（type = real_shoot）
# ─────────────────────────────────────────────
shoot_instructions:
  - shot: 5
    reason: "涉及真人肖像，按 V6 规则改为拍摄指令"
    camera_height: ""
    framing: ""                # 景别
    action: ""                 # 动作顺序
    props: []
    location: ""
    note: ""                   # 如"避免露出可识别面部"
    ai_alternative: ""         # 不露脸替代方案（手部/背影/远景）
    ai_alternative_prompt: ""

# ─────────────────────────────────────────────
# 6. 配音稿
# ─────────────────────────────────────────────
voiceover:
  language: "pt-BR"
  words_per_second: 2.5
  lines:
    - shot: 1
      time: "0-3s"
      text: ""
      word_count: 0
      cumulative_words: 0
      estimated_seconds: 0
  total_words: 0
  overlaps_time_window: false   # 必须为 false

tts_settings:
  accent: "Português (Brasil)"
  gender: ""
  tone: ""
  speed: 1.0                    # 不超过 1.1
  pauses: "句末 0,3s / 镜头切换 0,2s"
  diacritics_checked: true      # ã ç õ é ê í ó ú 已核对

# ─────────────────────────────────────────────
# 7. 字幕
# ─────────────────────────────────────────────
subtitles:
  lines:
    - shot: 1
      time: "0-3s"
      line1: ""
      line2: ""
      chars: 0
      chars_limit: 20
      line_count: 1             # 必须 ≤2
      position: ""
  safe_area_note: "竖版避开底部 20% / 顶部 15%"

silent_test:
  understand_product: true      # 静音能否看懂是什么产品
  understand_selling_point: true
  understand_cta: true
  passed: true                  # 三项全 true 才算通过

# ─────────────────────────────────────────────
# 8. 技术需求
# ─────────────────────────────────────────────
tech_requirements:
  aspect_ratio: "1:1"           # 或 9:16 / 16:9
  resolution: ""
  bgm_mood: ""
  bgm_license: "需使用可商用素材"   # 强制标注
  sfx_list: []
  overlay_elements: []          # 后期叠加的图形（Logo 位、参数卡）

# ─────────────────────────────────────────────
# 9. 视频合规扫描
# ─────────────────────────────────────────────
compliance_scan:
  V1_fake_proof: {hits: 0, actions: []}
  V2_param_mismatch: {hits: 0, actions: []}
  V3_scene_out_of_scope: {hits: 0, actions: []}
  V4_absolute_terms: {hits: 0, actions: []}
  V5_unauthorized_brand: {hits: 0, actions: []}
  V6_real_person_portrait: {hits: 0, actions: []}
  V7_dangerous_demo: {hits: 0, actions: []}
  V8_license_required: {hits: 0, actions: []}
  conclusion: ""                # 全 0 时写 "视频合规扫描：无命中"

# ─────────────────────────────────────────────
# 10. 发布前提醒
# ─────────────────────────────────────────────
pre_publish:
  - "已按配音音频对齐分镜时长（分镜时长是建议值）"
  - "已核对 PT-BR 变音符号（TTS 易错点）"
  - "BGM / 音效已确认可商用"
  - "静音状态下核心信息可理解"
  - "结尾 CTA 与 title_final 一致"
  - "已记录本次 Prompt 版本号"
