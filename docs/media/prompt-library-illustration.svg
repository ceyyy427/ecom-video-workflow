<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" rx="16" fill="#f3f5f1"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Arial,sans-serif"><rect x="0" y="0" width="200" height="900" rx="0" fill="#edf1eb" stroke="none"/><text x="28" y="57" font-size="26" fill="#36483f" font-weight="700">剪序</text><text x="28" y="84" font-size="12" fill="#66746b" font-weight="400">电商视频工作台</text><text x="28" y="165" font-size="12" fill="#89978d" font-weight="400">01</text><text x="62" y="165" font-size="15" fill="#36483f" font-weight="400">商品制作</text><rect x="16" y="190" width="168" height="42" rx="8" fill="#d9e5dc" stroke="none"/><text x="28" y="217" font-size="12" fill="#89978d" font-weight="400">02</text><text x="62" y="217" font-size="15" fill="#36483f" font-weight="600">镜头参考</text><text x="28" y="269" font-size="12" fill="#89978d" font-weight="400">03</text><text x="62" y="269" font-size="15" fill="#36483f" font-weight="400">样片参考</text><text x="28" y="321" font-size="12" fill="#89978d" font-weight="400">04</text><text x="62" y="321" font-size="15" fill="#36483f" font-weight="400">数据复盘</text><text x="26" y="789" font-size="13" fill="#36483f" font-weight="400">首次配置</text><text x="26" y="824" font-size="13" fill="#36483f" font-weight="400">数据与版本</text><text x="26" y="858" font-size="11" fill="#758277" font-weight="400">本机运行 · 人工确认</text><text x="230" y="49" font-size="26" fill="#36483f" font-weight="650">为这一句，找到合适的方法</text><text x="230" y="79" font-size="13" fill="#6b7c70" font-weight="400">商品资料 → 文稿与方向 → 镜头编辑 → 人工审核</text><text x="230" y="879" font-size="12" fill="#65786a" font-weight="400">基于已实现工作台绘制的界面示意 · 非浏览器截图 · 示例内容</text><rect x="230" y="111" width="1180" height="74" rx="8" fill="#fff" stroke="none"/><text x="250" y="138" font-size="11" fill="#758376" font-weight="400">当前商品</text><text x="250" y="165" font-size="16" fill="#36483f" font-weight="600">轻装出发 · 示例商品</text><text x="790" y="138" font-size="11" fill="#758376" font-weight="400">当前句子</text><text x="790" y="165" font-size="16" fill="#36483f" font-weight="400">看清口袋，再看上身。</text><rect x="230" y="202" width="1180" height="70" rx="8" fill="#fff" stroke="none"/><text x="250" y="244" font-size="14" fill="#7b887d" font-weight="400">商品细节、整体到局部…</text><text x="820" y="244" font-size="13" fill="#36483f" font-weight="400">全部类别    ∨</text><text x="1010" y="244" font-size="13" fill="#36483f" font-weight="400">已有本机适配   ∨</text><rect x="1290" y="220" width="98" height="35" rx="8" fill="#315b47" stroke="none"/><text x="1319" y="243" font-size="13" fill="white" font-weight="400">查找</text><text x="230" y="303" font-size="12" fill="#6c7a6e" font-weight="400">本机 124 张卡 · 150 种变体</text><rect x="230" y="325" width="442" height="108" rx="4" fill="#e0e9df" stroke="none"/><text x="250" y="361" font-size="18" fill="#36483f" font-weight="600">整体与细节同步双窗</text><text x="250" y="390" font-size="13" fill="#6e7f70" font-weight="400">同款同帧，细节有据可看</text><text x="250" y="416" font-size="12" fill="#315b47" font-weight="400">已有本机适配   ·   查看与选择 →</text><rect x="230" y="447" width="442" height="108" rx="4" fill="#fff" stroke="none"/><text x="250" y="483" font-size="18" fill="#36483f" font-weight="600">商品主角登场</text><text x="250" y="512" font-size="13" fill="#6e7f70" font-weight="400">画面聚焦，不伪造新角度</text><text x="250" y="538" font-size="12" fill="#315b47" font-weight="400">已有本机适配   ·   查看与选择 →</text><rect x="230" y="569" width="442" height="108" rx="4" fill="#fff" stroke="none"/><text x="250" y="605" font-size="18" fill="#36483f" font-weight="600">字形商品开场</text><text x="250" y="634" font-size="13" fill="#6e7f70" font-weight="400">原稿摘句，展开真实商品</text><text x="250" y="660" font-size="12" fill="#315b47" font-weight="400">已有本机适配   ·   查看与选择 →</text><rect x="230" y="691" width="442" height="108" rx="4" fill="#fff" stroke="none"/><text x="250" y="727" font-size="18" fill="#36483f" font-weight="600">局部标注与讲解</text><text x="250" y="756" font-size="13" fill="#6e7f70" font-weight="400">让文字指出正在讲的部位</text><text x="250" y="782" font-size="12" fill="#315b47" font-weight="400">已有本机适配   ·   查看与选择 →</text><rect x="696" y="325" width="714" height="486" rx="8" fill="#fff" stroke="none"/><text x="724" y="370" font-size="25" fill="#36483f" font-weight="650">整体与细节同步双窗</text><text x="724" y="406" font-size="14" fill="#617666" font-weight="400">用于 轻装出发 · 当前第2镜</text><rect x="724" y="430" width="655" height="159" rx="8" fill="#eef2e9" stroke="none"/><text x="744" y="462" font-size="13" fill="#36483f" font-weight="400">商品：本机示例。人群：周末出行。气质：清楚、自然。</text><text x="744" y="494" font-size="13" fill="#36483f" font-weight="400">本镜原稿：看清口袋，再看上身。</text><text x="744" y="526" font-size="13" fill="#36483f" font-weight="400">画面方法：整体与细节同帧，保留商品和完整动作。</text><text x="744" y="558" font-size="13" fill="#36483f" font-weight="400">不从参考卡增加商品性能；只调整这一镜的观看方式。</text><text x="724" y="630" font-size="12" fill="#6e7e6e" font-weight="400">选择本机变体</text><rect x="724" y="644" width="655" height="38" rx="4" fill="#f4f6f1" stroke="#d6dfd3"/><text x="741" y="669" font-size="14" fill="#36483f" font-weight="400">细节双窗 · 克制</text><rect x="724" y="710" width="248" height="43" rx="8" fill="#315b47" stroke="none"/><text x="743" y="738" font-size="14" fill="white" font-weight="400">带入这一镜 · 返回核对</text><text x="724" y="784" font-size="12" fill="#65796a" font-weight="400">只带入草稿；保存、听核与成片审核仍由你确认。</text></g></svg>