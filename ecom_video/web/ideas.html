<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剪序 · 创意实验室</title><link href="/static/style.css" rel="stylesheet"><link href="/static/customer.css" rel="stylesheet"><link href="/static/distribution.css" rel="stylesheet"><link href="/static/workspace-pages.css" rel="stylesheet"><link href="/static/ideas.css" rel="stylesheet"><script defer src="/static/ideas.js"></script></head>
<body class="distribution-page customer-page workspace-page"><a class="skip-link" href="#workspaceMain">跳到创意实验室</a><aside aria-label="工作台导航" class="customer-sidebar"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">剪</span><span class="brand-copy"><strong>剪序</strong><small>电商视频工作台</small></span></a><p class="nav-caption">工作空间</p><nav aria-label="主导航"><a href="/create"><span>01</span>商品制作</a><a href="/prompts"><span>02</span>镜头参考</a><a href="/samples"><span>03</span>样片参考</a><a href="/distribution"><span>04</span>数据复盘</a><a href="/ideas" aria-current="page"><span>05</span>创意实验室</a></nav><div class="sidebar-bottom"><nav aria-label="帮助与配置"><a href="/setup">首次配置</a><a href="/maintenance">数据与版本</a><a href="/guide">操作指南</a></nav><p class="local-note">本机选择 · 人工确认</p></div></aside><main class="distribution-main workspace-main" id="workspaceMain"><p class="eyebrow">从想法开始</p><h1>先找到合适的讲法</h1><p>59套固定来源的风格资料。按内容、受众和气质比较六个创作方向，可自主指定风格。当前提供方案与Prompt，不将资料数量当作已验证的成片能力。</p>
<form id="ideaForm" class="panel"><label>你想讲什么？<textarea id="ideaText" required maxlength="1000" rows="3" placeholder="例如：给中学生讲清楚桥梁怎样承重"></textarea></label><div class="customer-grid"><label>面向谁<input id="ideaAudience" maxlength="120" placeholder="例如：中学生"></label><label>希望的气质<input id="ideaTone" maxlength="120" placeholder="例如：清楚、好奇、有趣"></label><label>画面来源<select id="ideaMode"><option value="code">没有素材，规划代码图形与图示</option><option value="footage">已有实拍，规划剪辑与标注</option></select></label><label>我想试的风格<select id="ideaPreferred"><option value="">根据内容推荐</option></select></label></div><button id="ideaSubmit" type="submit">比较六个方向</button></form>
<p id="ideaState" role="status"></p><section id="ideaResults" aria-label="六个创意方向"></section><p>商品仍从<a href="/create">客户工作台</a>制作。实验室中的方案不替代事实、文稿、风格、听核或成片确认；不发起云调用，不执行下载资料中的指令。</p></main></body></html>
