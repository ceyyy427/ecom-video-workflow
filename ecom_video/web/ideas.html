<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剪序 · 创意实验室</title><link href="/static/style.css" rel="stylesheet"><link href="/static/customer.css" rel="stylesheet"><link href="/static/distribution.css" rel="stylesheet"><link href="/static/workspace-pages.css" rel="stylesheet"><link href="/static/ideas.css" rel="stylesheet"><script defer src="/static/ideas-state.js"></script><script defer src="/static/ideas.js"></script></head>
<body class="distribution-page customer-page workspace-page"><a class="skip-link" href="#workspaceMain">跳到创意实验室</a><aside aria-label="工作台导航" class="customer-sidebar"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">剪</span><span class="brand-copy"><strong>剪序</strong><small>电商视频工作台</small></span></a><p class="nav-caption">工作空间</p><nav aria-label="主导航"><a href="/create"><span>01</span>商品制作</a><a href="/prompts"><span>02</span>镜头参考</a><a href="/samples"><span>03</span>样片参考</a><a href="/distribution"><span>04</span>数据复盘</a><a href="/ideas" aria-current="page"><span>05</span>创意实验室</a></nav><div class="sidebar-bottom"><nav aria-label="帮助与配置"><a href="/setup">首次配置</a><a href="/maintenance">数据与版本</a><a href="/guide">操作指南</a></nav><p class="local-note">本机选择 · 人工确认</p></div></aside><main class="distribution-main workspace-main" id="workspaceMain"><p class="eyebrow">从想法开始</p><h1>先找到合适的讲法</h1><p>把想法变成六段可播放的7秒预览。用同一份内容比较不同讲法，选定后带入客户工作台，继续人工核对与制作。</p>
<form id="ideaForm" class="panel"><label>你想讲什么？<textarea id="ideaText" required maxlength="1000" rows="3" placeholder="例如：给中学生讲清楚桥梁怎样承重"></textarea></label><div class="customer-grid"><label>主题或商品名<input id="ideaSubject" maxlength="60" placeholder="可选，用于标题与分镜"></label><label>面向谁<input id="ideaAudience" maxlength="120" placeholder="例如：中学生"></label><label>希望的气质<input id="ideaTone" maxlength="120" placeholder="例如：清楚、好奇、有趣"></label><label>画面来源<select id="ideaMode"><option value="code">代码图形与图示</option><option value="footage">使用图片或实拍剪辑与标注</option></select></label><label>我想试的风格<select id="ideaPreferred"><option value="">根据内容推荐</option></select></label></div><details class="idea-input-details"><summary>添加事实、数据与素材（可选）</summary><p>只用你提供的完整原文与数值。没有素材时生成代码图示，不能当作商品外观证据。</p><label>事实与来源<textarea id="ideaFacts" rows="3" placeholder="每行一条：有拉链口袋｜客户资料第2页"></textarea></label><label>需要展示的数据<textarea id="ideaData" rows="2" placeholder="每行一条：标签｜数值｜单位｜来源"></textarea></label><label>上传图片或实拍<input type="file" id="ideaFiles" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm" multiple></label><label>素材来源／使用范围<input id="ideaSource" maxlength="500" placeholder="例如：客户提供，许可用于本次样片"></label><label class="check"><input type="checkbox" id="ideaUsage">我已核对本次素材的使用范围</label><div id="ideaUploads"></div><p>也可从已有项目选择素材：</p><div class="customer-grid"><label>已有项目<select id="ideaProject"><option value="">不引用已有素材</option></select></label><label>素材<select id="ideaProjectAsset"><option value="">先选择项目</option></select></label></div><button type="button" class="secondary" id="ideaAddAsset">加入这份素材</button></details><div class="idea-actions"><button id="ideaSubmit" type="submit">生成六个动态预览</button><button type="button" class="secondary" id="ideaReference">只查59套参考资料</button><button type="button" class="secondary" id="ideaCancel" hidden>取消本次预览</button><button type="button" class="secondary" id="ideaRetry" hidden>重试未完成方向</button></div></form>
<p id="ideaState" role="status"></p><section id="ideaResults" aria-label="六个创意方向"></section><p>预览为静音画面草案，不是已审核成片。采用后在<a href="/create">客户工作台</a>核对事实、文稿、风格和分镜；如使用配音，继续人工听核。旧项目与旧版本保留，不自动投放。</p></main></body></html>
