<body class="distribution-page customer-page workspace-page prompt-page"><a class="skip-link" href="#workspaceMain">跳到参考库</a>
<aside aria-label="工作台导航" class="customer-sidebar"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">剪</span><span class="brand-copy"><strong>剪序</strong><small>电商视频工作台</small></span></a><p class="nav-caption">工作空间</p><nav aria-label="主导航"><a href="/create"><span>01</span>商品制作</a><a href="/prompts" aria-current="page"><span>02</span>镜头参考</a><a href="/samples"><span>03</span>样片参考</a><a href="/distribution"><span>04</span>数据复盘</a></nav><div class="sidebar-bottom"><nav aria-label="帮助与配置"><a href="/setup">首次配置</a><a href="/maintenance">数据与版本</a><a href="/guide">操作指南</a></nav><p class="local-note">本机选择 · 人工确认</p></div></aside>
<main class="distribution-main workspace-main" id="workspaceMain"><div class="page-heading workspace-page-heading"><div><p class="eyebrow">为这一句，找到合适的画面方法</p><h1>镜头参考库</h1><p>自己选一张卡，再根据商品和文稿适配。选中不会自动制作。</p></div><a id="backToProject" href="/create">返回商品制作 →</a></div>
<section class="panel prompt-context" aria-label="当前商品"><label>用在哪个商品<select id="libraryProject"><option value="">先浏览参考</option></select></label><label>用在哪一句<select id="libraryShot"><option value="">先选择商品和卡片</option></select></label></section>
<form id="librarySearch" class="panel prompt-search"><label>查找镜头目的或手法<input id="libraryQuery" type="search" maxlength="240" placeholder="整体到细节、文字遮罩、商品登场…"></label><label>类别<select id="libraryCategory"><option value="">全部类别</option></select></label><label>适配情况<select id="libraryStatus"><option value="">全部参考</option><option value="adapted">已有本机适配</option><option value="reference_only">参考待适配</option></select></label><button type="submit">查找</button></form>
<p id="libraryStats" role="status" aria-live="polite">读取本机索引…</p><div class="prompt-layout"><div id="libraryResults" class="prompt-results" aria-label="参考卡列表"></div><section id="libraryDetail" class="panel prompt-detail" aria-live="polite"><h2>先选一个画面方法</h2><p>左侧查看卡片，再选择商品和分镜。这里会说明如何沿用你的原稿、实拍与动作。</p></section></div>
<details class="prompt-boundary"><summary>关于来源与可执行范围</summary><p>完整索引是参考资料。只有已实现的本机变体可以带入镜头；其他卡可供构思。参考方法不会新增商品事实，也不复用上游品牌素材。逐镜修改、人工听核和成片审核继续保留，不自动投放。</p></details></main></body></html>
