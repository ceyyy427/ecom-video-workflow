name: Windows customer native contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ECOM_QIANCHUAN_WRITES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --locked python -c "import subprocess; from ecom_video.host_os import npm_command; subprocess.run([*npm_command(), 'ci', '--no-audit', '--no-fund'], cwd='render/remotion', check=True, timeout=600)"
      - run: node render/remotion/setup-browser.mjs
      - run: |
          New-Item -ItemType Directory -Force -Path native-evidence
          uv run --locked pytest -q tests/test_customer_portability.py tests/test_customer_recovery.py::test_page_backup_restore_preserves_media_and_old_data tests/test_customer_recovery.py::test_maintenance_blocks_writes_and_worker_claims tests/test_customer_setup.py::test_customer_api_mode_enforces_safe_profile --junitxml=native-evidence/results.xml 2>&1 | Tee-Object native-evidence/pytest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-contract-evidence
          path: native-evidence
